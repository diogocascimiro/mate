name: DL e DE
on:
  schedule:
    - cron: "7,37 10-23 * * 1-5"
    - cron: "17 12,18 * * 0,6"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dados
  cancel-in-progress: false
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save --no-package-lock pdfjs-dist@4.4.168
      - run: node dl/rodar.mjs
      - name: Publicar dados
        run: |
          git config user.name "mate-bot"
          git config user.email "mate-bot@users.noreply.github.com"
          # guarda os dados gerados nesta rodada
          rm -rf "$RUNNER_TEMP/dados" && cp -r dados "$RUNNER_TEMP/dados"
          # publica sobre a versao mais recente do repositorio (evita conflito de merge)
          for tentativa in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp -r "$RUNNER_TEMP/dados/." dados/
            git add dados
            if git diff --cached --quiet; then echo "Sem mudancas nos dados"; exit 0; fi
            git commit -m "dados: DL e DE $(date -u +%F' '%H:%M)"
            if git push; then exit 0; fi
            echo "Push recusado (tentativa $tentativa), tentando de novo..."
            sleep 10
          done
          exit 1
