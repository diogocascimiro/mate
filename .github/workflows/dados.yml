name: DL e DE
on:
  schedule:
    - cron: "7,37 10-23 * * 1-5"
    - cron: "17 12,18 * * 0,6"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dados
  cancel-in-progress: false
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save --no-package-lock pdfjs-dist@4.4.168
      - run: node dl/rodar.mjs
      - name: Publicar dados
        run: |
          git config user.name "mate-bot"
          git config user.email "mate-bot@users.noreply.github.com"
          git add dados
          git diff --cached --quiet || (git commit -m "dados: DL e DE $(date -u +%F' '%H:%M)" && git pull --rebase -X theirs && git push)
